[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaggems-lightx2v"
version = "0.1.0"
description = "LightX2V numerical contracts implemented with Triton and FlagTree"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch", "packaging"]

[project.optional-dependencies]
test = ["pytest", "numpy"]
dev = ["black", "isort", "flake8", "build"]

[project.urls]
Repository = "https://github.com/CherryLemon/FlagGems-lightx2v"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
