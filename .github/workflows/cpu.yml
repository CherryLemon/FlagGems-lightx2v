name: CPU contracts and package
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch triton pytest build black isort flake8
      - run: python -m pip install --no-deps .
      - run: python -m pytest tests/test_contracts.py -q
      - run: black --check src tests examples benchmark
      - run: isort --check-only --profile black src tests examples benchmark
      - run: flake8 --max-line-length=120 --extend-ignore=E203,W503 src tests examples benchmark
      - run: python -m build
