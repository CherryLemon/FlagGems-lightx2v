repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: isort --check-only --profile black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8 --max-line-length=120 --extend-ignore=E203,W503
        language: system
        types: [python]
